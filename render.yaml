# Render Free is suitable for a public demo. Its filesystem is ephemeral:
# SQLite data and uploaded files can be lost when the service sleeps/restarts.
services:
  - type: web
    name: sudms
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: SUDMS_INSTANCE_PATH
        value: /var/data/sudms
      - key: SUDMS_HTTPS
        value: "1"
      - key: SUDMS_SECRET_KEY
        generateValue: true
      - key: SUDMS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SUDMS_BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: SUDMS_BOOTSTRAP_ADMIN_STUDENT_ID
        sync: false
      - key: SUDMS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
