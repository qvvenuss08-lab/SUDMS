<section class="card-minimal mb-4" id="document-attachments"><h2>ไฟล์แนบ</h2>
{% for file in attached_files %}<div class="attachment-row"><i class="bi bi-file-earmark-text"></i><div>{{file.filename}}</div><div class="d-flex gap-2">{% if file.filename.lower().endswith('.pdf') %}<a class="btn btn-light btn-sm" href="/api/attachments/{{file.id}}/view" target="_blank" rel="noopener">เปิดดู PDF</a>{% endif %}<a class="btn btn-outline-secondary btn-sm" href="/api/attachments/{{file.id}}/download">ดาวน์โหลด{{' Word' if file.filename.lower().endswith('.docx') else ''}}</a></div></div>{% else %}<p class="text-muted">เอกสารฉบับนี้ยังไม่มีไฟล์แนบ</p>{% endfor %}</section>
